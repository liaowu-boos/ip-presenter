name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_release.py
      - run: npm test
      - run: python -m pytest -q tests/test_backend.py tests/test_qwen.py tests/test_qwen_floor.py tests/test_qwen_interaction.py tests/test_qwen_playback.py tests/test_qwen_speech.py tests/test_performance_recordings.py
      - run: npm run build
